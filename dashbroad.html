<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>中文怪物 - 全球中文挑戰賽記分板</title>
<style>
  /* 頁面基礎設定：黑色背景，禁止選取文字以免誤觸 */
  body {
    margin: 0; padding: 0;
    background-color: #000;
    color: #0f0;
    font-family: 'Courier New', Courier, monospace;
    overflow-x: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* 背景特效層 */
  #matrix-bg {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: -1;
    opacity: 0.3; /* 降低背景干擾 */
  }

  /* 標題區 */
  header {
    text-align: center; padding: 15px;
    background: linear-gradient(180deg, rgba(0,20,0,0.95) 0%, rgba(0,0,0,0) 100%);
    position: sticky; top: 0; z-index: 100;
    border-bottom: 1px solid #0f0;
    box-shadow: 0 5px 15px rgba(0,255,0,0.2);
  }
  h1 { margin: 0; text-shadow: 0 0 10px #0f0; letter-spacing: 3px; font-style: italic; }

  /* 20人網格佈局 */
  .container {
    display: grid;
    grid-template-columns: repeat(5, 1fr); /* 電腦版 5欄 */
    gap: 12px;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* 卡片樣式 */
  .player-card {
    background: rgba(0, 30, 0, 0.8);
    border: 1px solid #0f0;
    border-radius: 6px;
    padding: 10px;
    text-align: center;
    box-shadow: 0 0 5px rgba(0,255,0,0.2);
    display: flex; flex-direction: column; justify-content: space-between;
  }

  /* 名字可編輯區 */
  .player-name {
    font-size: 1.1rem; color: #fff;
    border-bottom: 1px dashed #060;
    margin-bottom: 5px; cursor: text;
  }
  .player-name:focus { outline: none; border-bottom: 1px solid #0f0; background: #000; }

  /* 分數大字 */
  .score-display {
    font-size: 2.2rem; font-weight: 900;
    color: #0f0; margin: 5px 0;
    text-shadow: 0 0 10px rgba(0,255,0,0.5);
  }

  /* 按鈕區 */
  .controls { display: flex; justify-content: space-between; gap: 5px; }
  button {
    flex: 1; border: 1px solid #0f0; background: transparent;
    color: #0f0; font-size: 1.2rem; font-weight: bold;
    cursor: pointer; padding: 5px 0;
  }
  button:active { background: #0f0; color: #000; }
  .btn-sub { border-color: #f33; color: #f33; }
  .btn-sub:active { background: #f33; color: #fff; }

  /* 手機/平板響應式調整 */
  @media (max-width: 1024px) { .container { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 768px) { .container { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 480px) { 
    .container { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px; }
    h1 { font-size: 1.5rem; }
    .score-display { font-size: 2rem; }
  }
</style>
</head>
<body>

<canvas id="matrix-bg"></canvas>
<header><h1>中文怪物挑戰賽</h1></header>
<div class="container" id="scoreboard"></div>

<script>
  // 1. 自動產生20個選手
  const container = document.getElementById('scoreboard');
  for (let i = 1; i <= 20; i++) {
    container.innerHTML += `
      <div class="player-card">
        <div class="player-name" contenteditable="true">選手 ${i}</div>
        <div class="score-display" id="score-${i}">0</div>
        <div class="controls">
          <button class="btn-sub" onclick="update(${i}, -1)">-</button>
          <button onclick="update(${i}, 1)">+</button>
        </div>
      </div>
    `;
  }

  // 2. 加減分邏輯
  function update(id, val) {
    const el = document.getElementById(`score-${id}`);
    let s = parseInt(el.innerText) + val;
    el.innerText = s;
    // 閃爍特效
    el.style.color = '#fff';
    setTimeout(() => el.style.color = '#0f0', 150);
  }

  // 3. Matrix 代碼雨動畫
  const cvs = document.getElementById('matrix-bg'), ctx = cvs.getContext('2d');
  function resize() { cvs.width=window.innerWidth; cvs.height=window.innerHeight; }
  window.onresize = resize; resize();
  const chars = '01XYZE'.split(''), drops = Array(Math.floor(cvs.width/14)).fill(1);
  setInterval(() => {
    ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(0,0,cvs.width,cvs.height);
    ctx.fillStyle = '#0F0'; ctx.font = '14px monospace';
    drops.forEach((y, i) => {
      ctx.fillText(chars[Math.floor(Math.random()*6)], i*14, y*14);
      if (y*14 > cvs.height && Math.random()>0.98) drops[i]=0;
      drops[i]++;
    });
  }, 50);
</script>
</body>
</html>
