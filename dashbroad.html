<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>中文怪物記分板 (Local Storage 版)</title>
<style>
  body {
    margin: 0; padding: 0;
    background-color: #000;
    color: #0f0;
    font-family: 'Courier New', Courier, monospace;
    overflow-x: hidden;
  }

  #matrix-bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.3;
    pointer-events: none;
  }

  #main-content {
    position: relative;
    z-index: 1;
    padding-bottom: 50px;
  }

  header {
    text-align: center; padding: 20px;
    background: linear-gradient(180deg, rgba(0,20,0,0.9) 0%, rgba(0,0,0,0) 100%);
    border-bottom: 1px solid #0f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  h1 { margin: 0; text-shadow: 0 0 10px #0f0; font-size: 1.8rem; }

  .btn-reset {
    background: rgba(0, 0, 0, 0.8);
    border: 1px dashed #f33;
    color: #f33;
    padding: 5px 15px;
    font-family: inherit;
    cursor: pointer;
    font-size: 0.9rem;
    transition: 0.2s;
  }
  .btn-reset:hover {
    background: #f33;
    color: white;
  }

  .container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    padding: 20px;
    max-width: 1200px;
    margin: 0 auto;
  }

  .player-card {
    background: rgba(0, 30, 0, 0.8);
    border: 1px solid #0f0;
    border-radius: 5px;
    padding: 10px;
    text-align: center;
    box-shadow: 0 0 5px rgba(0,255,0,0.3);
    transition: transform 0.1s;
  }
  .player-card:hover {
    box-shadow: 0 0 15px rgba(0,255,0,0.5);
  }

  .player-name {
    font-size: 1.1rem; color: #fff;
    border-bottom: 1px dashed #060;
    margin-bottom: 5px; cursor: text;
    padding: 2px;
    min-height: 1.2em;
    display: block;
    transition: background-color 0.2s;
  }
  .player-card:hover .player-name {
    background: rgba(0, 255, 0, 0.05);
  }
  .player-name:focus {
    background: rgba(0, 255, 0, 0.2);
    outline: none;
    border-bottom: 1px solid #0f0;
  }

  .score-display {
    font-size: 2rem; font-weight: bold;
    color: #0f0; margin: 5px 0;
  }

  .controls { display: flex; gap: 5px; }
  
  button.ctrl-btn {
    flex: 1; background: #000; border: 1px solid #0f0;
    color: #0f0; font-size: 1.2rem; cursor: pointer; padding: 5px;
    transition: all 0.1s;
  }
  button.ctrl-btn:active { background: #0f0; color: #000; transform: scale(0.95); }
  .btn-sub { border-color: #f33 !important; color: #f33 !important; }
  .btn-sub:active { background: #f33 !important; color: #fff !important; }

  @media (max-width: 800px) { .container { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>

<canvas id="matrix-bg"></canvas>

<div id="main-content">
  <header>
    <h1>中文怪物挑戰賽 <span style="font-size:0.6em; vertical-align: middle; color: #0f0;">🔊</span></h1>
    <button class="btn-reset" onclick="resetData()">⚠ 清除紀錄並重置 ⚠</button>
  </header>
  
  <div class="container" id="scoreboard">
    <h2 style="text-align:center; grid-column:span 5; color:white;">
      系統載入中...
    </h2>
  </div>
</div>

<script>
  const STORAGE_KEY = 'monster_scoreboard_v1';
  const TOTAL_PLAYERS = 20;

  window.onload = function() {
    renderScoreboard();
    startMatrix();
    
    const board = document.getElementById('scoreboard');

    board.addEventListener('input', function(e) {
      if (e.target.classList.contains('player-name')) {
        saveData();
      }
    });

    board.addEventListener('keydown', function(e) {
      if (e.target.classList.contains('player-name')) {
        if (e.key === 'Enter') {
          e.preventDefault();
          e.target.blur();
        }
      }
    });
  };

  function renderScoreboard() {
    const box = document.getElementById('scoreboard');
    
    let savedData = localStorage.getItem(STORAGE_KEY);
    let players = [];

    if (savedData) {
      players = JSON.parse(savedData);
    } else {
      for (let i = 1; i <= TOTAL_PLAYERS; i++) {
        players.push({ id: i, name: `選手 ${i}`, score: 0 });
      }
    }

    if (players.length !== TOTAL_PLAYERS) {
       players = [];
       for (let i = 1; i <= TOTAL_PLAYERS; i++) {
        players.push({ id: i, name: `選手 ${i}`, score: 0 });
      }
    }

    let html = '';
    players.forEach((player, index) => {
      html += `
        <div class="player-card" id="card-${index}">
          <div class="player-name" contenteditable="true" spellcheck="false" title="點擊編輯名字">${player.name}</div>
          <div class="score-display" id="score-display-${index}">${player.score}</div>
          <div class="controls">
            <button class="ctrl-btn btn-sub" onclick="updateScore(${index}, -1)">-</button>
            <button class="ctrl-btn" onclick="updateScore(${index}, 1)">+</button>
          </div>
        </div>
      `;
    });

    box.innerHTML = html;
  }

  window.updateScore = function(index, val) {
    const scoreEl = document.getElementById(`score-display-${index}`);
    if (scoreEl) {
      let current = parseInt(scoreEl.innerText);
      let newScore = current + val;
      scoreEl.innerText = newScore;
      
      scoreEl.style.color = '#fff';
      setTimeout(() => { scoreEl.style.color = '#0f0'; }, 100);

      saveData();
    }
  };

  function saveData() {
    const players = [];
    
    for (let i = 0; i < TOTAL_PLAYERS; i++) {
      const card = document.getElementById(`card-${i}`);
      if (card) {
        const name = card.querySelector('.player-name').innerText; 
        const score = parseInt(card.querySelector('.score-display').innerText); 
        players.push({ id: i + 1, name: name, score: score });
      }
    }

    localStorage.setItem(STORAGE_KEY, JSON.stringify(players));
  }

  window.resetData = function() {
    if (confirm('確定要清除所有姓名和分數紀錄嗎？')) {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }
  };

  function startMatrix() {
    const cvs = document.getElementById('matrix-bg');
    if (!cvs) return;
    const ctx = cvs.getContext('2d');
    
    function resize() { 
      cvs.width = window.innerWidth; 
      cvs.height = window.innerHeight; 
    }
    resize();
    window.addEventListener('resize', resize);

    const columns = Math.floor(cvs.width / 14);
    const drops = new Array(columns).fill(1);
    const chars = '01XYZE';

    setInterval(function() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, cvs.width, cvs.height);
      
      ctx.fillStyle = '#0F0';
      ctx.font = '14px monospace';
      
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * 14, drops[i] * 14);
        
        if (drops[i] * 14 > cvs.height && Math.random() > 0.98) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }, 50);
  }

  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playClickSound() {
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    const oscillator = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();

    oscillator.type = 'triangle';
    oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
    oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.15);

    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

    oscillator.connect(gainNode);
    gainNode.connect(audioCtx.destination);

    oscillator.start();
    oscillator.stop(audioCtx.currentTime + 0.15);
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('button') || e.target.classList.contains('player-name')) {
        playClickSound();
    }
  });

</script>

</body>
</html>
